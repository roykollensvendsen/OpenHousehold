name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  specification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check specification integrity
        run: python3 scripts/check_spec.py
      - name: Test the validators
        run: python3 -m unittest discover -s tests -v
      - name: Check authored commit subjects
        run: python3 scripts/check_commits.py --all
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned resolver
        run: python3 -m pip install --require-hashes --no-deps -r prototype/requirements-uv.txt
      - name: Install the locked prototype environment
        run: uv sync --locked
      - name: Test the prototype offline
        run: uv run python -m unittest discover -s prototype/tests -t . -v
